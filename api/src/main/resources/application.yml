spring:
  application:
    name: ajt-backend

  profiles:
    # "dev" liga SQL no log e Swagger; em producao use AJT_PROFILE=prod
    active: ${AJT_PROFILE:dev}

  datasource:
    url: ${AJT_DB_URL:jdbc:postgresql://localhost:5454/ajt_db}
    username: ${AJT_DB_USER:postgres}
    password: ${AJT_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  cache:
    type: caffeine
    cache-names: cotacoes
    caffeine:
      # Frankfurter atualiza 1x por dia; 30 min evita chamadas repetidas sem ficar desatualizado
      spec: maximumSize=200,expireAfterWrite=30m

  # (Spring Cloud OpenFeign 4.x: o prefixo antigo "feign.client" nao e mais lido)
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

jwt:
  secret: ${AJT_JWT_SECRET}
  expiration: ${AJT_JWT_EXPIRATION:86400000} # 24h em milissegundos

ajt:
  crypto:
    # chave AES-256 em Base64 (32 bytes). Gerar com: openssl rand -base64 32
    key: ${AJT_CRYPTO_KEY}
  cors:
    allowed-origins: ${AJT_CORS_ORIGINS:http://localhost:4200}
  login:
    max-tentativas: ${AJT_LOGIN_MAX_TENTATIVAS:5}
    bloqueio-minutos: ${AJT_LOGIN_BLOQUEIO_MINUTOS:15}
  cotacao:
    url: ${AJT_COTACAO_URL:https://api.frankfurter.dev/v1}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
