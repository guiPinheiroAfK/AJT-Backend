spring:
  application:
    name: ajt-backend

  datasource:
    url: ${AJT_DB_URL:jdbc:postgresql://localhost:5454/ajt_db}
    username: ${AJT_DB_USER:postgres}
    password: ${AJT_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

jwt:
  secret: ${AJT_JWT_SECRET}
  expiration: ${AJT_JWT_EXPIRATION:86400000} # 24h em milissegundos

feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000