spring:
  application:
    name: ajt-backend

  datasource:
    url: jdbc:postgresql://localhost:5454/ajt_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

jwt:
  secret: troque-essa-chave-depois-por-uma-bem-grande-e-aleatoria-64chars-no-minimo
  expiration: 86400000 # 24h em ms