services:

  postgres:
    image: postgres:16
    container_name: ajt-postgres
    environment:
      POSTGRES_DB: ajt_db
      POSTGRES_USER: ${AJT_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AJT_DB_PASSWORD:-postgres}
    ports:
      # so acessivel pela propria maquina (nao expoe o banco na rede)
      - "127.0.0.1:5454:5432"
    volumes:
      - ajt_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AJT_DB_USER:-postgres} -d ajt_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./api
    container_name: ajt-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9090:8080"
    environment:
      AJT_DB_URL: jdbc:postgresql://postgres:5432/ajt_db
      AJT_DB_USER: ${AJT_DB_USER:-postgres}
      AJT_DB_PASSWORD: ${AJT_DB_PASSWORD:-postgres}
      AJT_JWT_SECRET: ${AJT_JWT_SECRET:?defina AJT_JWT_SECRET no .env}
      AJT_JWT_EXPIRATION: ${AJT_JWT_EXPIRATION:-86400000}
      AJT_CRYPTO_KEY: ${AJT_CRYPTO_KEY:?defina AJT_CRYPTO_KEY no .env}
      AJT_CORS_ORIGINS: ${AJT_CORS_ORIGINS:-http://localhost:4200}
      AJT_PROFILE: ${AJT_PROFILE:-dev}

volumes:
  ajt_data:
